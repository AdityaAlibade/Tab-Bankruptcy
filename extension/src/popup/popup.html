<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Bankruptcy</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-row">
        <img class="logo-icon-img" src="../../icons/icon48.png" alt="Tab Bankruptcy" />
        <h1 class="title">TAB BANKRUPTCY</h1>
      </div>
      <p class="subtitle">Multi-window tab session capture</p>
    </header>

    <!-- Stats Bar -->
    <section class="stats-card" aria-label="Open Chrome Statistics">
      <div class="stat-item">
        <span class="stat-label">Open Tabs</span>
        <span class="stat-value" id="openTabsCount">—</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Windows</span>
        <span class="stat-value" id="openWindowsCount">—</span>
      </div>
    </section>

    <!-- Main Action Button -->
    <button id="stashBtn" class="primary-btn" type="button">
      <span class="btn-icon">📦</span>
      <span class="btn-text">Stash All Tabs</span>
    </button>

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite">
      <div class="status-row">
        <span class="status-icon" id="statusIcon">✓</span>
        <span class="status-message" id="statusMessage"></span>
      </div>
      <div class="status-row" id="backendStatusRow">
        <span class="status-icon" id="backendStatusIcon">✓</span>
        <span class="status-message" id="backendStatusMessage"></span>
      </div>
    </div>

    <!-- Captured Tabs Section -->
    <section class="captured-section">
      <div class="section-header">
        <div class="section-title-wrap">
          <h2 class="section-title">Captured Tabs</h2>
          <span id="capturedCountBadge" class="badge">0</span>
        </div>
        <span id="sessionTime" class="session-time"></span>
      </div>

      <!-- Scrollable Tab List -->
      <div id="tabList" class="tab-list">
        <!-- Rendered dynamically -->
        <div class="empty-state" id="emptyState">
          <p>No tabs captured yet.</p>
          <span class="empty-hint">Click "Stash All Tabs" to capture all windows.</span>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
